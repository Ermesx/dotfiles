# packages.<platform>.profiles.<name>.<method>: [items]
#   platform   global (added to every platform) | windows | linux
#   profile    chosen at `chezmoi init` (#20); base is always on and holds what every
#              setup needs (the configs rely on git, delta, less, jq and vscode); same names on every platform,
#              content per platform; a profile may be missing on a platform
#   pick: true each item is offered separately at init (default: whole profile)
#   method     how the items are installed (listed per platform below)
packages:

  # methods: dotnet_tools (dotnet tool install -g), yazi_plugins (ya pkg add)
  global:
    profiles:
      shell:
        yazi_plugins: [yazi-rs/plugins:full-border]
      sdk:
        dotnet_tools:
          - dotnet-ef
          - dotnet-reportgenerator-globaltool
          - dotnet-outdated-tool
          - dotnet-user-secrets
          - dotnet-dev-certs
          - gitversion.tool
          - dotnet-coverage
          - dotnet-trace
          - dotnet-counters
          - dotnet-dump
          - dotnet-stack
          - refitter

  # methods: scoop ([bucket/]app; buckets taken from the prefix), modules (Install-Module -Scope CurrentUser), wsl (one distro, a scalar)
  windows:
    profiles:
      base:
        scoop:
          - pwsh
          - git
          - chezmoi
          - 7zip
          - extras/windows-terminal
          - extras/powertoys
          - extras/caffeine
          - nerd-fonts/Hasklig-NF
          # what the shipped configs rely on in every setup: the editor, the git pager (delta, less) and jq
          - extras/vscode
          - delta
          - less
          - jq
      shell:
        scoop:
          # shell
          - starship
          - zoxide
          - yazi
          # fzf
          - fzf
          - fd
          - ripgrep
          - eza
          - bat
          # git
          - extras/onefetch
          - extras/lazygit
          - gitql
          - gh
          - gitleaks
        modules: [Terminal-Icons, PSfzf, posh-git]
      sdk:
        scoop:
          - dotnet-sdk
          - nodejs
          - python
          - uv
        modules: [powershell-yaml, Pester]
        wsl: Ubuntu-24.04
      containers:
        scoop:
          # Linux engine in its own WSL distro; also the only docker, compose and buildx on PATH (ADR-0004)
          - extras/rancher-desktop
          - lazydocker
        modules: [DockerCompletion]
      apps:
        pick: true
        scoop:
          - extras/rider
          - extras/googlechrome
          - extras/postman
          - vagrant
      ai:
        pick: true
        scoop: [claude-code]

  # methods: brew, zsh_plugins (Linux scripts are out of scope, see #12)
  linux:
    profiles:
      base:
        brew: [git]
      shell:
        brew: [zsh, oh-my-zsh, zoxide, fzf, fd, ripgrep, eza, fzf-tab, lazygit, gitql, onefetch]
        zsh_plugins: [zsh-autosuggestions, zsh-syntax-highlighting]
      sdk:
        brew: [docker]
