packages:
  dotnet_tools:
    - dotnet-ef
    - dotnet-reportgenerator-globaltool
    - dotnet-outdated-tool
    - dotnet-user-secrets
    - dotnet-dev-certs
    - gitversion.tool
    - dotnet-coverage
    - dotnet-trace
    - dotnet-counters
    - dotnet-dump
    - dotnet-stack

  yazi_plugins:
    - yazi-rs/plugins:full-border

  windows:
    wsl: Ubuntu-24.04
    wingets:
      # shell
      - Microsoft.PowerShell
      - Starship.Starship
      - Microsoft.WindowsTerminal
      - ajeetdsouza.zoxide
      - sxyazi.yazi

      # fzf
      - junegunn.fzf
      - sharkdp.fd
      - BurntSushi.ripgrep.MSVC
      - eza-community.eza
      - sharkdp.bat

      # git
      - Git.Git
      - o2sh.onefetch
      - dandavison.delta
      - jftuga.less
      - JesseDuffield.lazygit
      - amrdeveloper.gitql
      - GitHub.cli

      # dotnet
      - Microsoft.DotNet.SDK.9

      # containers
      - Docker.DockerDesktop
      - Hashicorp.Vagrant

      # chezmoi
      - twpayne.chezmoi

      # editors
      - Microsoft.VisualStudioCode
      - JetBrains.Rider

      # browsers
      - Google.Chrome

      # other
      - Microsoft.PowerToys
      - jqlang.jq

    modules:
      - Microsoft.WinGet.Client
      - Terminal-Icons
      - PSfzf
      - posh-git
      - DockerCompletion
      - powershell-yaml
      - Pester

  linux:
    brews:
      # shell
      - zsh
      - oh-my-zsh
      - zoxide

      # fzf
      - fzf
      - fd
      - ripgrep
      - eza
      - fzf-tab

      # git
      - git
      - lazygit
      - gitql
      - onefetch

      # docker
      - docker

    casks:

    modules:
      - zsh-autosuggestions
      - zsh-syntax-highlighting
